name: sentinel-pomdp

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique PostgreSQL password}
    volumes:
      - sentinel_operations_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH to neo4j/<a unique password>}
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
      NEO4J_dbms_security_auth__minimum__password__length: 12
    volumes:
      - sentinel_deployment_neo4j_data:/data
      - sentinel_deployment_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SENTINEL_PORT:-8000}:8000"
    environment:
      SENTINEL_DEPLOYMENT_MODE: candidate
      SENTINEL_BACKEND: neo4j
      SENTINEL_LLM_PROVIDER: ${SENTINEL_LLM_PROVIDER:-fake}
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:?Set a 32+ character API key}
      SENTINEL_PRINCIPAL_ID: ${SENTINEL_PRINCIPAL_ID:-local-analyst}
      SENTINEL_TENANT_ID: ${SENTINEL_TENANT_ID:-tenant_alpha}
      SENTINEL_ROLES: ${SENTINEL_ROLES:-analyst}
      SENTINEL_PERMISSIONS: ${SENTINEL_PERMISSIONS:-investigation:execute,evidence:read,provenance:read,trace:read,workflow:resume,document:upload,document:read}
      SENTINEL_DOCUMENT_STORE: /app/data/company_documents
      SENTINEL_MAX_UPLOAD_BYTES: ${SENTINEL_MAX_UPLOAD_BYTES:-10485760}
      SENTINEL_MAX_UNCOMPRESSED_BYTES: ${SENTINEL_MAX_UNCOMPRESSED_BYTES:-52428800}
      SENTINEL_MAX_DOCUMENTS_PER_TENANT: ${SENTINEL_MAX_DOCUMENTS_PER_TENANT:-100}
      SENTINEL_EXTERNAL_LLM_ENABLED: ${SENTINEL_EXTERNAL_LLM_ENABLED:-0}
      SENTINEL_ALLOWED_LLM_PROVIDERS: ${SENTINEL_ALLOWED_LLM_PROVIDERS:-}
      SENTINEL_GROQ_MODEL: ${SENTINEL_GROQ_MODEL:-openai/gpt-oss-120b}
      SENTINEL_OPENAI_MODEL: ${SENTINEL_OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set the same password used by NEO4J_AUTH}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      SENTINEL_PLANNING_HORIZON: ${SENTINEL_PLANNING_HORIZON:-2}
      SENTINEL_MAX_TOOL_CALLS: ${SENTINEL_MAX_TOOL_CALLS:-3}
      SENTINEL_INVESTIGATION_BUDGET: ${SENTINEL_INVESTIGATION_BUDGET:-1.0}
      SENTINEL_REQUEST_TIMEOUT_SECONDS: ${SENTINEL_REQUEST_TIMEOUT_SECONDS:-45}
      SENTINEL_RATE_LIMIT_PER_MINUTE: ${SENTINEL_RATE_LIMIT_PER_MINUTE:-30}
      SENTINEL_CHECKPOINT_MODE: postgres
      SENTINEL_OPERATIONS_BACKEND: postgres
      SENTINEL_OPERATIONS_DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel
      SENTINEL_API_WORKERS: 1
      SENTINEL_LOGGING_MODE: structured
    volumes:
      - sentinel_company_documents:/app/data/company_documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: ["python", "scripts/run_worker.py"]
    # Workers do not serve HTTP. The operations endpoint checks durable heartbeats.
    healthcheck:
      disable: true
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SENTINEL_DEPLOYMENT_MODE: candidate
      SENTINEL_BACKEND: neo4j
      SENTINEL_LLM_PROVIDER: fake
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:?Set a 32+ character API key}
      SENTINEL_PRINCIPAL_ID: ${SENTINEL_PRINCIPAL_ID:-local-analyst}
      SENTINEL_TENANT_ID: ${SENTINEL_TENANT_ID:-tenant_alpha}
      SENTINEL_ROLES: ${SENTINEL_ROLES:-analyst}
      SENTINEL_PERMISSIONS: ${SENTINEL_PERMISSIONS:-document:upload,job:submit,job:read,job:cancel,operations:read}
      SENTINEL_DOCUMENT_STORE: /app/data/company_documents
      SENTINEL_OPERATIONS_BACKEND: postgres
      SENTINEL_OPERATIONS_DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel
      SENTINEL_CHECKPOINT_MODE: postgres
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set the same password used by NEO4J_AUTH}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    volumes:
      - sentinel_company_documents:/app/data/company_documents
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512m

volumes:
  sentinel_deployment_neo4j_data:
  sentinel_deployment_neo4j_logs:
  sentinel_company_documents:
  sentinel_operations_postgres:
