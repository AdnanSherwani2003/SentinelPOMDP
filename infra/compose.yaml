services:
  neo4j:
    image: neo4j:5.26-community
    container_name: sentinel-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"  # HTTP web browser (bound locally)
      - "127.0.0.1:7687:7687"  # Bolt protocol driver (bound locally)
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:?Set NEO4J_AUTH to neo4j/<a unique local password>}
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_memory_pagecache_size=256m
      - NEO4J_dbms_security_auth__minimum__password__length=8
    volumes:
      - sentinel_neo4j_data:/data
      - sentinel_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  sentinel_neo4j_data:
    name: sentinel_neo4j_data
  sentinel_neo4j_logs:
    name: sentinel_neo4j_logs
