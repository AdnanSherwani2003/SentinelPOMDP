[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-pomdp"
version = "0.1.0"
description = "Evidence-driven investigation with Bayesian POMDP planning, provenance and justified abstention"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "neo4j>=5.28.6",
    "numpy>=1.20.0",
    "openai>=2.0,<3.0",
    "openpyxl>=3.1,<4",
    "pydantic>=2.13.5",
    "pypdf>=5,<7",
    "psycopg[binary,pool]>=3.2,<4",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[dependency-groups]
dev = ["pytest>=7.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live_olist: requires a reachable local Neo4j and the local Olist archive",
    "live_llm: paid, opt-in test against a configured real LLM provider",
    "live_groq: opt-in test against Groq Cloud with RUN_LIVE_GROQ_TESTS=1",
    "live_security: security integration test against an available local Neo4j service",
    "live_api: FastAPI integration test against an available local Neo4j service",
    "live_company_data: enterprise ingestion integration test against an available Neo4j service",
    "live_pilot: calibrated-pilot integration test against an available Neo4j service",
    "live_operations: integration test against an explicitly disposable PostgreSQL database",
]

[tool.setuptools.package-data]
sentinel_pomdp = ["web/*.html", "web/*.css", "web/*.js", "operations/migrations/*.sql"]
